<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<meta name="description" content="">
<link rel="stylesheet" href="styles.css">
<script src="strings.js" defer></script>
<script src="script.js" defer></script>
</head>
<body>
<a class="skip" href="#work" data-copy="skip"></a>
<header class="bar wrap">
  <a class="wordmark" href="#" id="barName"></a>
  <nav><a href="#work" data-copy="navigation.work"></a><a href="#about" data-copy="navigation.about"></a><a id="barMail" data-copy="navigation.email"></a></nav>
</header>
<main>
  <section class="hero wrap" aria-labelledby="who">
    <div class="eyebrow"><span id="role"></span></div>
    <h1 id="who" data-copy="hero.headline"></h1>
    <div class="hero-bottom"><p id="bio"></p><a class="text-link" href="#work" data-copy="hero.link"></a></div>
    <div class="hero-rule" aria-hidden="true"><span>+</span><span>+</span><span>+</span></div>
  </section>
  <section class="work wrap" id="work" aria-labelledby="workTitle">
    <div class="section-heading"><h2 id="workTitle" data-copy="selectedWork"></h2><span data-copy="workNote"></span></div>
    <div id="plates"></div>
  </section>
  <section class="other wrap" aria-labelledby="otherTitle"><div class="section-heading"><h2 id="otherTitle" data-copy="otherWork"></h2><span data-copy="otherNote"></span></div><div id="otherProjects"></div></section>
  <section class="about wrap" id="about" aria-labelledby="aboutTitle"><h2 class="eyebrow" id="aboutTitle" data-copy="about.label"></h2><div><h3 data-copy="about.heading"></h3><div id="intro"></div><div class="about-links"><a id="barGh" data-copy="navigation.github"></a><a id="barLi" data-copy="navigation.linkedin"></a></div></div></section>
  <footer class="wrap"><p class="eyebrow" data-copy="footer.message"></p><a class="contact" id="mailto" data-copy="footer.contact"></a><div class="footer-bottom"><span id="footSmall"></span><a href="#" data-copy="footer.top"></a></div></footer>
</main>
</body>
</html>
